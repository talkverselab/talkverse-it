name: italian_universe
description: "이탈리아어유니버스 — 한국 화자 이탈리아어 학습 앱"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  package_info_plus: ^10.2.2
  cupertino_icons: ^1.0.8

  # Talkverse ID 로그인·스토어 결제 (2026-11-02, 한자 앱과 같은 구성)
  http: ^1.6.0
  flutter_web_auth_2: ^5.1.0
  flutter_secure_storage: ^11.2.0
  sign_in_with_apple: ^8.2.0
  crypto: ^3.0.8
  video_player: ^2.14.1
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_storekit: ^0.4.16

  # Audio
  audioplayers: ^6.1.0

  # Storage
  shared_preferences: ^2.5.6
  path_provider: ^2.1.5
  sqflite: ^2.4.0

  # Util
  csv: ^6.0.0
  flutter_svg: ^2.0.10+1
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.0

  # Drift (SQLite ORM)
  drift: ^2.33.0
  drift_flutter: ^0.3.0
  sqlite3_flutter_libs: ^0.6.0+eol

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

  # Drift codegen
  drift_dev: ^2.33.0
  build_runner: ^2.15.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/audio_manifest.json
    - assets/data/version.json
    - assets/data/dialogues/
    - assets/data/dialogues/R0/friends/
    - assets/data/dialogues/R0/life/
    - assets/data/dialogues/R0/love/
    - assets/data/dialogues/R1/culture/
    - assets/data/dialogues/R1/friends/
    - assets/data/dialogues/R1/life/
    - assets/data/dialogues/R1/love/
    - assets/data/dialogues/R1/survival/
    - assets/data/dialogues/R1/travel/
    - assets/data/dialogues/R1/work/
    - assets/data/dialogues/R2/friends/
    - assets/data/dialogues/R2/life/
    - assets/data/dialogues/R2/love/
    - assets/data/dialogues/R2/travel/
    - assets/data/dialogues/R2/work/
    - assets/data/dialogues/R3/friends/
    - assets/data/dialogues/R3/life/
    - assets/data/dialogues/R3/love/
    - assets/data/dialogues/R3/survival/
    - assets/data/dialogues/R3/travel/
    - assets/data/dialogues/R4/culture/
    - assets/data/dialogues/R4/friends/
    - assets/data/dialogues/R4/life/
    - assets/data/dialogues/R4/love/
    - assets/data/dialogues/R4/study/
    - assets/data/dialogues/R4/travel/
    - assets/data/dialogues/R4/work/
    - assets/data/dialogues/R5/culture/
    - assets/data/dialogues/R5/friends/
    - assets/data/dialogues/R5/life/
    - assets/data/dialogues/R5/love/
    - assets/data/dialogues/R5/study/
    - assets/data/dialogues/R5/travel/
    - assets/data/dialogues/R5/work/
    - assets/data/script_rev.json
    - assets/data/freq/
    - assets/data/grammar/
    - assets/data/vocab/
    - assets/images/ipa/

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "#008C45"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  min_sdk_android: 21
